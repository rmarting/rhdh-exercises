apiVersion: apps.gitlab.com/v1beta1
kind: GitLab
metadata:
  name: gitlab
  namespace: gitlab-system
spec:
  chart:
    values:
      prometheus:
        install: false
      certmanager:
        install: false
      nginx-ingress:
        enabled: false
      global:
        hosts:
          domain: ${BASEDOMAIN}
        ingress:
          class: none
          configureCertmanager: false
          annotations:
            route.openshift.io/termination: edge
          tls:
            enabled: false
    version: "9.10.7"
